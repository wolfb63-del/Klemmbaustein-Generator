name: Kalibrierdatenbank pruefen

on:
  pull_request:
    paths:
      - 'kalibrierdatenbank.json'
      - 'werkzeuge/pruefe_kalibrierdatenbank.py'
      - 'Klemmbaustein.py'

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wertebereiche pruefen
        run: python werkzeuge/pruefe_kalibrierdatenbank.py
